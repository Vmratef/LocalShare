name: Build Fast APK (release)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: chmod +x gradlew
      - name: Build release (R8 optimized, much smoother than debug)
        run: ./gradlew assembleRelease
      - name: Sign with the fixed test key (so updates install over each other)
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER sign \
            --ks .github/test-release.jks \
            --ks-pass pass:android --key-pass pass:android \
            --out LocalShare-fast.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LocalShare-fast-apk
          path: LocalShare-fast.apk
